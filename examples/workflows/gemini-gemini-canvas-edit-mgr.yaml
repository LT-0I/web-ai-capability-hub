# New 2026-05-25 — explicit gemini-canvas-edit-mgr yaml; mirrors gemini-canvas-edit.yaml so the closure runner's first lookup (${service}-${id}.yaml = gemini-gemini-canvas-edit-mgr.yaml) succeeds.
id: gemini-canvas-edit-mgr
target: gemini
profile: gemini-9225
mode: automatic
description: Create a Gemini canvas and apply an edit so before/after HTML can be compared
steps:
  - id: invoke-cli
    command:
      - node
      - dist/src/cli.js
      - webai:gemini:canvas-edit
      - --profile
      - gemini-9225
      - --prompt
      - "Use Canvas to draft an editable document titled \"Wave 12 Canvas Fixture\". Include a heading \"Wave 12 Canvas Fixture\" and one short paragraph about reliable automation. Make it a document, not code or an app. Do not open external apps."
      - --confirmed
      - --edit-text
      - "Change the heading text to \"Wave 12 Canvas Fixture Updated\" and keep the paragraph."
      - --response-timeout-ms
      - "90000"
      - --json
    timeoutMs: 180000
    gate:
      exit_code: 0
      json_path:
        - path: canvas_opened
          equals: true
        - path: canvas_html_before
          nonempty: true
        - path: canvas_html_after
          nonempty: true
evidence: .runs/capability-explore-2026-05-25/gemini/gemini-canvas-edit-mgr.json
