# New 2026-05-25 — explicit gemini-canvas-edit-mgr yaml; mirrors gemini-canvas-edit.yaml so the closure runner's first lookup (${service}-${id}.yaml = gemini-gemini-canvas-edit-mgr.yaml) succeeds.
id: gemini-canvas-edit-mgr
target: gemini
profile: gemini-9225
mode: automatic
description: Create a Gemini canvas and apply an edit so before/after HTML can be compared
steps:
  - id: invoke-cli
    command:
      - node
      - dist/src/cli.js
      - webai:gemini:canvas-edit
      - --profile
      - gemini-9225
      - --prompt
      - "Use Canvas to create a short editable document titled Coffee Brewing Tips with two bullet points. Do not use Google Keep or any external app."
      - --confirmed
      - --edit-text
      - " Add a closing sentence about espresso."
      - --response-timeout-ms
      - "90000"
      - --json
    timeoutMs: 180000
    gate:
      exit_code: 0
      json_path:
        - path: canvas_opened
          equals: true
        - path: canvas_html_before
          nonempty: true
        - path: canvas_html_after
          nonempty: true
evidence: .runs/capability-explore-2026-05-25/gemini/gemini-canvas-edit-mgr.json
