id: gemini-music-download-track-ext
target: gemini
profile: gemini-9225
mode: automatic
description: Generate a Gemini Music track, then download that finished track as MP3
steps:
  - id: ensure_track
    command:
      - node
      - dist/src/cli.js
      - webai:gemini:music:generate
      - --profile
      - gemini-9225
      - --backend
      - extension-assisted-cdp
      - --prompt
      - "A short calm acoustic guitar loop, instrumental, 30 seconds"
      - --confirmed
      - --download-dir
      - /tmp/explore-2026-05-25/gemini
      - --timeout-ms
      - "300000"
      - --json
    timeoutMs: 360000
    gate:
      exit_code: 0
      json_path:
        - path: conversation_url
          nonempty: true
  - id: invoke-cli
    command:
      - node
      - dist/src/cli.js
      - webai:gemini:music:download-track
      - --profile
      - gemini-9225
      - --tab-url-contains
      - "{{steps.ensure_track.conversation_url}}"
      - --format
      - mp3
      - --download-dir
      - /tmp/explore-2026-05-25/gemini
      - --json
    timeoutMs: 120000
    gate:
      exit_code: 0
      json_path:
        - path: savedPath
          nonempty: true
evidence: .runs/capability-explore-2026-05-25/gemini/gemini-music-download-track-ext.json
