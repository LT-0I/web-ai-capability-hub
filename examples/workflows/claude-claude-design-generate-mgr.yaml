# New 2026-05-25 (was missing-workflow). Source: .runs/capability-explore-2026-05-25/claude/claude-design-generate-mgr.json. Requires a pre-existing project_url; uses the L7 evidence project_url.
id: claude-design-generate-mgr
target: claude
profile: claude-9224
mode: automatic
description: Generate a Claude Design HTML page on an existing project
steps:
  - id: generate
    command:
      - node
      - dist/src/cli.js
      - webai:claude:design:generate
      - --profile
      - claude-9224
      - --project-url
      - https://claude.ai/design/p/baf06427-9e7a-41f7-8d8e-79da1a1ca344
      - --prompt
      - "Generate a single-page landing site for a coffee shop named 'Probe Cafe'. Use modern minimal style with hero image and 3-feature section."
      - --timeout-ms
      - "300000"
      - --response-timeout-ms
      - "300000"
      - --json
    timeoutMs: 360000
    gate:
      exit_code: 0
      json_path:
        - path: fileName
          nonempty: true
  - id: get_html
    command:
      - node
      - dist/src/cli.js
      - webai:claude:design:get-html
      - --profile
      - claude-9224
      - --project-url
      - "{{steps.generate.projectUrl}}"
      - --download-dir
      - /tmp/explore-2026-05-25/claude-design
      - --json
    timeoutMs: 120000
    gate:
      exit_code: 0
      json_path:
        - path: savedPath
          nonempty: true
        - path: byteSize
          nonempty: true
evidence: .runs/capability-explore-2026-05-25/claude/claude-design-generate-mgr.json
