# Rewritten 2026-05-25 from codex L4 draft.
id: claude-generate-file-py-ext
target: claude
profile: claude-9224
mode: automatic
description: Generate a downloadable .py file in Claude
steps:
  - id: invoke-cli
    command:
      - node
      - dist/src/cli.js
      - webai:claude:generate-file
      - --profile
      - claude-9224
      - --backend
      - extension-assisted-cdp
      - --prompt
      - Write a Python script that prints 'hello claude probe' and includes one short comment. Provide as a downloadable .py file.
      - --expected-extension
      - py
      - --download-dir
      - /tmp/explore-2026-05-25/claude
      - --artifact-class
      - code
      - --json
    timeoutMs: 240000
    gate:
      exit_code: 0
      json_path:
        - path: path
          nonempty: true
evidence: .runs/capability-explore-2026-05-25/claude/claude-generate-file-py-ext.json
