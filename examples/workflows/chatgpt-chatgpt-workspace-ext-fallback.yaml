id: chatgpt-workspace-ext-fallback
target: chatgpt
profile: chatgpt
mode: automatic
description: Attempt to list ChatGPT workspaces (fail-closed; schema rejects --action list)
steps:
  - id: invoke-cli
    command:
      - node
      - dist/src/cli.js
      - webai:chatgpt:workspace
