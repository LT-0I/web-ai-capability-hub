# Rewritten 2026-05-25 from codex L1 draft.
id: claude-send-basic-ext
target: claude
profile: claude-9224
mode: automatic
description: Claude send basic prompt via extension-assisted CDP
steps:
  - id: invoke-cli
    command:
      - node
      - dist/src/cli.js
      - webai:claude:send-prompt
      - --profile
      - claude-9224
      - --backend
      - extension-assisted-cdp
      - --prompt
      - say only the word OK
      - --response-timeout-ms
      - "90000"
      - --json
    timeoutMs: 180000
    gate:
      exit_code: 0
      json_path:
        - path: response_text
          nonempty: true
        - path: completion_detected
          equals: true
        - path: chat_url
          regex: "claude\\.ai/"
evidence: .runs/capability-explore-2026-05-25/claude/claude-send-basic-ext.json
