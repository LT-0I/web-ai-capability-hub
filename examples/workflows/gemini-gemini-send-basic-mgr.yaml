# Rewritten 2026-05-25 from codex G1/G10 draft.
id: gemini-send-basic-mgr
target: gemini
profile: gemini-9225
mode: automatic
description: Send a minimal prompt to Gemini and verify completion
steps:
  - id: invoke-cli
    command:
      - node
      - dist/src/cli.js
      - webai:gemini:send-prompt
      - --profile
      - gemini-9225
      - --prompt
      - say only the word OK
      - --response-timeout-ms
      - "90000"
      - --json
    timeoutMs: 180000
    gate:
      exit_code: 0
      json_path:
        - path: response_text
          nonempty: true
        - path: completion_detected
          equals: true
evidence: .runs/capability-explore-2026-05-25/gemini/gemini-send-basic-mgr.json
