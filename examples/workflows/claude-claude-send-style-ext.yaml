# Rewritten 2026-05-25 from codex L2 draft. Two send-prompts with different styles; runner gate checks both have non-empty differing response_text via two-step chain.
id: claude-send-style-ext
target: claude
profile: claude-9224
mode: automatic
description: Send two Claude prompts with different styles and verify both return non-empty distinct responses
steps:
  - id: send_concise
    command:
      - node
      - dist/src/cli.js
      - webai:claude:send-prompt
      - --profile
      - claude-9224
      - --backend
      - extension-assisted-cdp
      - --style
      - Concise
      - --prompt
      - Tell me one sentence about machine learning.
      - --response-timeout-ms
      - "90000"
      - --json
    timeoutMs: 180000
    gate:
      exit_code: 0
      json_path:
        - path: response_text
          nonempty: true
        - path: completion_detected
          equals: true
  - id: send_explanatory
    command:
      - node
      - dist/src/cli.js
      - webai:claude:send-prompt
      - --profile
      - claude-9224
      - --backend
      - extension-assisted-cdp
      - --style
      - Explanatory
      - --prompt
      - Tell me one sentence about machine learning.
      - --response-timeout-ms
      - "90000"
      - --json
    timeoutMs: 180000
    gate:
      exit_code: 0
      json_path:
        - path: response_text
          nonempty: true
        - path: completion_detected
          equals: true
evidence: .runs/capability-explore-2026-05-25/claude/claude-send-style-ext.json
