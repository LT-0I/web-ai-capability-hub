# Rewritten 2026-05-25 from codex G3 draft.
id: gemini-generate-image-ext
target: gemini
profile: gemini-9225
mode: automatic
description: Generate an image in Gemini and save the downloaded PNG
steps:
  - id: invoke-cli
    command:
      - node
      - dist/src/cli.js
      - webai:gemini:generate-image
      - --profile
      - gemini-9225
      - --backend
      - extension-assisted-cdp
      - --prompt
      - A clean futuristic laboratory notebook icon, blue and white, transparent background
      - --download-dir
      - /tmp/explore-2026-05-25/gemini
      - --json
    timeoutMs: 300000
    gate:
      exit_code: 0
      json_path:
        - path: path
          nonempty: true
        - path: sha256
          nonempty: true
evidence: .runs/capability-explore-2026-05-25/gemini/gemini-generate-image-ext.json
