id: gemini-music-generate-ext
target: gemini
profile: gemini-9225
mode: automatic
description: Generate a Gemini Music track via extension-assisted backend
steps:
  - id: invoke-cli
    command:
      - node
      - dist/src/cli.js
      - webai:gemini:music:generate
      - --profile
      - gemini-9225
      - --backend
      - extension-assisted-cdp
      - --prompt
      - "A short upbeat acoustic guitar loop, instrumental, 30 seconds"
      - --confirmed
      - --download-dir
      - /tmp/explore-2026-05-25/gemini
      - --timeout-ms
      - "300000"
      - --json
    timeoutMs: 360000
    gate:
      exit_code: 0
      json_path:
        - path: task_id
          nonempty: true
evidence: .runs/capability-explore-2026-05-25/gemini/gemini-music-generate-ext.json
