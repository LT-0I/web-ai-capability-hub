# Rewritten 2026-05-25 from codex C4 draft. FAIL_CLOSED_EXT_BACKEND status; gate honors original success criteria.
id: chatgpt-generate-file-pptx-ext
target: chatgpt
profile: chatgpt
mode: automatic
description: Generate a downloadable .pptx file in ChatGPT
steps:
  - id: invoke-cli
    command:
      - node
      - dist/src/cli.js
      - webai:chatgpt:generate-file
      - --profile
      - chatgpt
      - --backend
      - extension-assisted-cdp
      - --prompt
      - Create a 5-slide pptx presentation about renewable energy basics, with one title slide and 4 content slides. Deliver as a downloadable .pptx.
      - --expected-extension
      - pptx
      - --download-dir
      - /tmp/explore-2026-05-25/chatgpt
      - --artifact-class
      - document
      - --json
    timeoutMs: 240000
    gate:
      exit_code: 0
      json_path:
        - path: path
          nonempty: true
evidence: .runs/capability-explore-2026-05-25/chatgpt/chatgpt-generate-file-pptx-ext.json
