# Rewritten 2026-05-25 from codex C1 draft. Schema: command-step workflow with mode: automatic.
# Note: needs an existing ChatGPT main chat tab; targets chatgpt.com tab.
id: chatgpt-select-model-thinking-ext
target: chatgpt
profile: chatgpt
mode: automatic
description: Select the Thinking model on a live ChatGPT main-chat tab
steps:
  - id: invoke-cli
    command:
      - node
      - dist/src/cli.js
      - webai:chatgpt:select-model
      - --profile
      - chatgpt
      - --backend
      - extension-assisted-cdp
      - --model
      - Thinking
      - --tab-url-contains
      - chatgpt.com
      - --json
    timeoutMs: 120000
    gate:
      exit_code: 0
      json_path:
        - path: ok
          equals: true
evidence: .runs/capability-explore-2026-05-25/chatgpt/chatgpt-select-model-thinking-ext.json
