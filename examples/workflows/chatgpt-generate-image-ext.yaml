# Rewritten 2026-05-25 from codex C2 draft. FAIL_CLOSED_EXT_BACKEND status (errorCode CHROME_EXTENSION_NOT_CONNECTED).
id: chatgpt-generate-image-ext
target: chatgpt
profile: chatgpt
mode: automatic
description: Attempt to generate an image in ChatGPT via the extension-assisted backend
steps:
  - id: invoke-cli
    command:
      - node
      - dist/src/cli.js
      - webai:chatgpt:generate-image
      - --profile
      - chatgpt
      - --backend
      - extension-assisted-cdp
      - --prompt
      - A clean futuristic laboratory notebook icon, blue and white, transparent background
      - --download-dir
      - /tmp/explore-2026-05-25/chatgpt
      - --json
    timeoutMs: 180000
    gate:
      exit_code: 0
      json_path:
        - path: path
          nonempty: true
        - path: sha256
          nonempty: true
evidence: .runs/capability-explore-2026-05-25/chatgpt/chatgpt-generate-image-ext.json
