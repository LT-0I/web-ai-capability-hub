# Rewritten 2026-05-25 from codex G2 draft.
id: gemini-upload-single-mgr
target: gemini
profile: gemini-9225
mode: automatic
description: Upload a text file to Gemini and verify a grounded quote
steps:
  - id: invoke-cli
    command:
      - node
      - dist/src/cli.js
      - webai:gemini:upload-and-query
      - --profile
      - gemini-9225
      - --file
      - /tmp/explore-2026-05-25/fixtures/fileA.txt
      - --prompt
      - Quote the first 3 words of this file verbatim
      - --response-timeout-ms
      - "180000"
      - --json
    timeoutMs: 240000
    gate:
      exit_code: 0
      json_path:
        - path: response_text
          regex: "alpha"
evidence: .runs/capability-explore-2026-05-25/gemini/gemini-upload-single-mgr.json
