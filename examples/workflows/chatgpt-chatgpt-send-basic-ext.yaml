# Rewritten 2026-05-25 from codex C1 draft. Schema: command-step workflow with mode: automatic.
id: chatgpt-send-basic-ext
target: chatgpt
profile: chatgpt
mode: automatic
description: Send a basic prompt through ChatGPT main chat
steps:
  - id: invoke-cli
    command:
      - node
      - dist/src/cli.js
      - webai:chatgpt:send-prompt
      - --profile
      - chatgpt
      - --backend
      - extension-assisted-cdp
      - --prompt
      - say only the word OK
      - --response-timeout-ms
      - "90000"
      - --json
    timeoutMs: 180000
    gate:
      exit_code: 0
      json_path:
        - path: response_text
          nonempty: true
        - path: completion_detected
          equals: true
        - path: conversation_id
          nonempty: true
evidence: .runs/capability-explore-2026-05-25/chatgpt/chatgpt-send-basic-ext.json
