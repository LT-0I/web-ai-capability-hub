# New 2026-05-25 — explicit gemini-gems-converse-mgr yaml so closure runner's first-lookup succeeds.
id: gemini-gems-converse-mgr
target: gemini
profile: gemini-9225
mode: automatic
description: Open a Gemini Gem URL and send a prompt
steps:
  - id: invoke-cli
    command:
      - node
      - dist/src/cli.js
      - webai:gemini:send-prompt
      - --profile
      - gemini-9225
      - --url
      - https://gemini.google.com/gem/coding-partner
      - --reuse-conversation
      - --prompt
      - Say only OK
      - --response-timeout-ms
      - "90000"
      - --timeout-ms
      - "120000"
      - --json
    timeoutMs: 180000
    gate:
      exit_code: 0
      json_path:
        - path: response_text
          nonempty: true
        - path: chat_url
          regex: "/gem/"
evidence: .runs/capability-explore-2026-05-25/gemini/gemini-gems-converse-mgr.json
