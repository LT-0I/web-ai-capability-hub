# Rewritten 2026-05-25 from codex L2 draft.
id: claude-send-incognito-ext
target: claude
profile: claude-9224
mode: automatic
description: Claude incognito-mode send-prompt
steps:
  - id: invoke-cli
    command:
      - node
      - dist/src/cli.js
      - webai:claude:send-prompt
      - --profile
      - claude-9224
      - --backend
      - extension-assisted-cdp
      - --incognito
      - --prompt
      - say only OK
      - --response-timeout-ms
      - "90000"
      - --json
    timeoutMs: 180000
    gate:
      exit_code: 0
      json_path:
        - path: response_text
          nonempty: true
        - path: chat_url
          regex: "incognito="
evidence: .runs/capability-explore-2026-05-25/claude/claude-send-incognito-ext.json
