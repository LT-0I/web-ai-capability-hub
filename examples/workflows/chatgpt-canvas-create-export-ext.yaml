# Rewritten 2026-05-25 from codex C6 draft.
id: chatgpt-canvas-create-export-ext
target: chatgpt
profile: chatgpt
mode: automatic
description: Create a Canvas document in ChatGPT and export it as Markdown
steps:
  - id: create_canvas
    command:
      - node
      - dist/src/cli.js
      - webai:chatgpt:send-prompt
      - --profile
      - chatgpt
      - --backend
      - extension-assisted-cdp
      - --canvas
      - --prompt
      - Create a canvas document titled 'Probe Canvas' with 3 short paragraphs about machine learning history.
      - --response-timeout-ms
      - "180000"
      - --json
    timeoutMs: 240000
    gate:
      exit_code: 0
      json_path:
        - path: response_text
          nonempty: true
        - path: chat_url
          nonempty: true
        - path: conversation_id
          nonempty: true
  - id: export_canvas_md
    command:
      - node
      - dist/src/cli.js
      - webai:chatgpt:canvas-export
      - --tab-url-contains
      - "{{steps.create_canvas.chat_url}}"
      - --format
      - md
      - --download-dir
      - /tmp/explore-2026-05-25/chatgpt
      - --json
    timeoutMs: 120000
    gate:
      exit_code: 0
      json_path:
        - path: path
          nonempty: true
evidence: .runs/capability-explore-2026-05-25/chatgpt/chatgpt-canvas-create-export-ext.json
