# Rewritten 2026-05-25 from codex C10 draft.
# User-confirmed 2026-05-26: Codex is exposed from the ChatGPT sidebar, not the inline chat composer; ELEMENT_NOT_FOUND is the expected feature-shape assertion.
id: chatgpt-codex-submit-task-ext-fallback
target: chatgpt
profile: chatgpt
mode: automatic
description: Assert inline ChatGPT Codex task submission is unavailable (sidebar-only Codex entry)
steps:
  - id: invoke-cli
    command:
      - node
      - dist/src/cli.js
      - webai:chatgpt:codex:submit-task
      - --profile
      - chatgpt
      - --env-name
      - LT-0I/CN-
      - --prompt
      - Add a one-line comment to README.md
      - --confirmed
      - --json
    timeoutMs: 300000
    gate:
      exit_code: 1
      json_path:
        - path: errorCode
          equals: ELEMENT_NOT_FOUND
evidence: .runs/capability-explore-2026-05-25/chatgpt/chatgpt-codex-submit-task-ext-fallback.json
