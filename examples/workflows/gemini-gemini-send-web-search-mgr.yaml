# Rewritten 2026-05-25 from codex G1 draft. FAIL_CLOSED_MANAGED with ELEMENT_NOT_FOUND.
id: gemini-send-web-search-mgr
target: gemini
profile: gemini-9225
mode: automatic
description: Send a Gemini web-search date prompt (fail-closed; ELEMENT_NOT_FOUND on tool drawer)
steps:
  - id: invoke-cli
    command:
      - node
      - dist/src/cli.js
      - webai:gemini:send-prompt
      - --profile
      - gemini-9225
      - --web-search
      - --prompt
      - List 3 AI safety events from 2026 so far. Include the year 2026 in each item.
      - --response-timeout-ms
      - "120000"
      - --json
    timeoutMs: 180000
    gate:
      exit_code: 1
      json_path:
        - path: errorCode
          equals: ELEMENT_NOT_FOUND
evidence: .runs/capability-explore-2026-05-25/gemini/gemini-send-web-search-mgr.json
