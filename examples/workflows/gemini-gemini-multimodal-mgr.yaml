# Rewritten 2026-05-25 from codex G2 draft.
id: gemini-multimodal-mgr
target: gemini
profile: gemini-9225
mode: automatic
description: Upload a PNG to Gemini and verify a multimodal description
steps:
  - id: invoke-cli
    command:
      - node
      - dist/src/cli.js
      - webai:gemini:upload-and-query
      - --profile
      - gemini-9225
      - --file
      - /tmp/explore-2026-05-25/fixtures/probe.png
      - --prompt
      - Describe this image in one sentence, including dominant color and shape.
      - --response-timeout-ms
      - "180000"
      - --json
    timeoutMs: 240000
    gate:
      exit_code: 0
      json_path:
        - path: response_text
          nonempty: true
evidence: .runs/capability-explore-2026-05-25/gemini/gemini-multimodal-mgr.json
