{
  "id": "chatgpt",
  "displayName": "ChatGPT Web",
  "category": "web-ai",
  "hosts": [
    "chatgpt.com",
    "chat.openai.com"
  ],
  "description": "Adapter template for reading ChatGPT web UI capabilities and operating visible controls only after user approval.",
  "capabilityHints": [
    "model selector",
    "prompt composer",
    "file upload",
    "tools menu",
    "project/workspace navigation",
    "download/export controls where visible"
  ],
  "semanticTargets": [
    {
      "id": "promptBox",
      "role": "textbox",
      "namePatterns": [
        "message",
        "prompt",
        "ask anything",
        "消息",
        "提问",
        "询问 ChatGPT",
        "向 ChatGPT 提问"
      ],
      "selectorHints": [
        "textarea",
        "[contenteditable=true]"
      ],
      "description": "Prompt composer"
    },
    {
      "id": "sendButton",
      "role": "button",
      "namePatterns": [
        "send",
        "submit",
        "发送",
        "发送消息",
        "提交"
      ],
      "selectorHints": [
        "button[aria-label*='Send' i]"
      ]
    },
    {
      "id": "modelSelector",
      "role": "button",
      "namePatterns": [
        "model",
        "GPT",
        "模型",
        "切换模型"
      ],
      "selectorHints": [
        "button"
      ]
    },
    {
      "id": "upload",
      "role": "button",
      "namePatterns": [
        "upload",
        "attach",
        "file",
        "上传",
        "附加",
        "文件",
        "添加文件"
      ]
    },
    {
      "id": "cancel",
      "role": "button",
      "namePatterns": [
        "cancel",
        "取消"
      ]
    },
    {
      "id": "close",
      "role": "button",
      "namePatterns": [
        "close",
        "关闭",
        "×"
      ]
    }
  ],
  "confirmationPolicy": {
    "requireFor": [
      "sendPrompt",
      "upload",
      "download",
      "bulkExport"
    ],
    "note": "Do not send prompts, upload files, or export conversation data without explicit approval."
  },
  "notesFile": "configs/adapters/notes/chatgpt.md"
}
