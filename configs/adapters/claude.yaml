{
  "id": "claude",
  "displayName": "Claude Web",
  "category": "web-ai",
  "hosts": [
    "claude.ai"
  ],
  "description": "Adapter template for Claude web UI. Selectors are deliberately semantic because the UI changes frequently.",
  "capabilityHints": [
    "project selector",
    "model selector",
    "prompt composer",
    "artifact area",
    "file upload",
    "download controls"
  ],
  "semanticTargets": [
    {
      "id": "promptBox",
      "role": "textbox",
      "namePatterns": [
        "message",
        "prompt",
        "talk to Claude",
        "消息",
        "提示词",
        "和 Claude 对话",
        "输入提示"
      ],
      "selectorHints": [
        "textarea",
        "[contenteditable=true]"
      ]
    },
    {
      "id": "sendButton",
      "role": "button",
      "namePatterns": [
        "send",
        "发送",
        "提交"
      ]
    },
    {
      "id": "projectSelector",
      "role": "button",
      "namePatterns": [
        "project",
        "workspace",
        "项目",
        "工作区"
      ]
    },
    {
      "id": "artifactPanel",
      "role": "region",
      "namePatterns": [
        "artifact",
        "工件",
        "产物",
        "Artifact"
      ]
    },
    {
      "id": "close",
      "role": "button",
      "namePatterns": [
        "close",
        "关闭"
      ]
    }
  ],
  "confirmationPolicy": {
    "requireFor": [
      "sendPrompt",
      "upload",
      "download",
      "projectChange"
    ]
  },
  "notesFile": "configs/adapters/notes/claude.md"
}
