{
  "id": "scopus",
  "name": "Scopus",
  "displayName": "Scopus",
  "category": "research-database",
  "hosts": [
    "scopus.com"
  ],
  "base_url": "https://www.scopus.com/",
  "search_url": "https://www.scopus.com/",
  "login_mode": "licensed_ip_or_institutional",
  "ip_login": true,
  "description": "Institutional Scopus access through entitled IP ranges or institutional sign-in.",
  "capability_hints": {
    "search_input": {
      "selectors": [
        "input[type='text']",
        "textarea"
      ]
    },
    "filter_panel": {
      "selectors": []
    },
    "export_button": {
      "selectors": []
    }
  },
  "capabilityHints": [
    "institutional access",
    "document search",
    "filters",
    "citation export"
  ],
  "semanticTargets": [
    {
      "id": "searchBox",
      "role": "textbox",
      "namePatterns": [
        "search",
        "query",
        "document search"
      ],
      "selectorHints": [
        "input[type='text']",
        "textarea"
      ]
    },
    {
      "id": "filterPanel",
      "role": "group",
      "namePatterns": [
        "filter",
        "refine",
        "facet"
      ],
      "selectorHints": []
    },
    {
      "id": "exportButton",
      "role": "button",
      "namePatterns": [
        "export",
        "download",
        "citation"
      ],
      "selectorHints": []
    }
  ],
  "confirmationPolicy": {
    "requireFor": [
      "download",
      "export",
      "bulkExport",
      "fullTextDownload"
    ],
    "note": "Use Scopus within licensed access and respect official export limits."
  }
}
